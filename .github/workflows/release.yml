# Выпуск Antresol — только по тегу vX.Y.Z (ставит владелец).
# Общий workflow семьи Anvil: сборка под Windows, antresol-X.Y.Z-windows-x64.zip, SHA256SUMS,
# GitHub Release с заметками из аннотации тега; подпись exe — если заведены секреты SIGN_PFX и
# SIGN_PASSWORD. Тег набора — тот же, что у anvil-ui в Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: AgitAngst/Anvil/.github/workflows/rust-release.yml@kit-v0.6.1
    with:
      app: antresol
      bins: antresol
    secrets: inherit
