[package]
name = "antresol"
version = "2.6.0"
edition = "2024"
description = "Quick-access panel at the top edge of the monitor"
license = "MIT"
publish = false

[[bin]]
name = "antresol"
path = "src/main.rs"

[dependencies]
# Общий вид семьи Anvil. Правка набора на живую — `[patch]` в .cargo/config.toml (не в git).
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.6.1" }
eframe = "0.36.2"

# Win32: мониторы, режимы экрана и масштаб, DDC/CI, запуск, горячая клавиша, автозапуск; съёмные диски и безопасное
# извлечение (IO, Ioctl, режим ошибок потока), перетаскивание файла с плашки (Ole, Shell);
# WinRT: медиа-сеансы (что играет), WIC — обложка; ресурсы: процессор, память, сеть, батарея, диски, PDH.
# Bluetooth-звук (2.6): точки и фильтры Windows (Media_Audio), команды драйвера «переподключить» и «отключить» (Media_KernelStreaming),
# ContainerId точки (Com_StructuredStorage, Variant, Shell_PropertiesSystem).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Networking_Connectivity",
    "Security_Cryptography",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
