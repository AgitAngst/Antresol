schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Antresol, a quick-access panel at the top edge of the monitor for Windows, written in
  Rust on egui and the Anvil kit (anvil-ui, tag kit-v*). It hides above the screen edge and slides
  out when the mouse touches the edge or on a hotkey; it is resizable; features are modules.
  Parts: src/app.rs (window, edge, show/hide, resize, settings), src/panel.rs (show/hide logic),
  src/modules/ (display, brightness, buttons), src/sys/ (Win32: monitors, display modes and scale,
  DDC/CI, launch, hotkeys, autostart). Sound is not part of Antresol: it will come from Kamerton.
  src/config.rs (settings and buttons files in %APPDATA%\Antresol).
  Where the project stands and how to work: HANDOFF.md; plan and stages: SPEC.md;
  docs of what exists now: docs/README.md; UI rules: docs/ui-guideline.md.
  Owner rules every artifact must respect:
  - every UI in the light AND the dark theme and in Russian AND English;
  - everything printed to a console or a log is in English; code comments are in Russian;
  - no new dependencies or downloads without the owner's explicit permission;
  - releases, tags, CI runs and pushes only on the owner's command;
  - the version grows with the plan: a stage - the second digit +1 from the CURRENT version
    (after 0.9.x comes 1.0.0), a fix inside a stage - the third; the fourth number is the
    build = commit count;
  - builds, target and temp files only on disk E:, never D:;
  - motion follows anvil-ui motion (docs/MOTION.md in Anvil) and the Windows "show animations" flag;
  - tasks include their tests and the doc updates (docs/, HANDOFF.md, SPEC.md) the change
    needs; nothing is marked verified live without the owner's words.

